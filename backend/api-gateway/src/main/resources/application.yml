server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth & Admin routes -> auth-service
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**, /api/admin/**

        # Classroom & Enrollment routes -> classroom-service
        - id: classroom-service
          uri: ${CLASSROOM_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/classes/**

        # Assessment & Test routes -> assessment-service
        - id: assessment-service
          uri: ${ASSESSMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/tests/**

        # Notification routes -> notification-service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/notifications/**

        # Analytics & AI routes -> analytics-service
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/analytics/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
