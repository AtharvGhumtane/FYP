version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fyp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL password must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fyp-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: fyp-api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CLASSROOM_SERVICE_URL=http://classroom-service:8082
      - ASSESSMENT_SERVICE_URL=http://assessment-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - ANALYTICS_SERVICE_URL=http://analytics-service:8085
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - classroom-service
      - assessment-service
      - notification-service
      - analytics-service
    networks:
      - fyp-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: fyp-auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?PostgreSQL password must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - ADMIN_NAME=${ADMIN_NAME:-System Administrator}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fyp-network

  classroom-service:
    build:
      context: .
      dockerfile: classroom-service/Dockerfile
    container_name: fyp-classroom-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/classroom_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?PostgreSQL password must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fyp-network

  assessment-service:
    build:
      context: .
      dockerfile: assessment-service/Dockerfile
    container_name: fyp-assessment-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/assessment_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?PostgreSQL password must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      - CLASSROOM_SERVICE_URL=http://classroom-service:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fyp-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: fyp-notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?PostgreSQL password must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fyp-network

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: fyp-analytics-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/analytics_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?PostgreSQL password must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      - ASSESSMENT_SERVICE_URL=http://assessment-service:8083
      - CLASSROOM_SERVICE_URL=http://classroom-service:8082
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy-gemini-key}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fyp-network

networks:
  fyp-network:
    driver: bridge

volumes:
  postgres_data:
